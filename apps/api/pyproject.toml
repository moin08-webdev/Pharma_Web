[project]
name = "pharmabridge-api"
version = "0.1.0"
description = "PharmaBridge API - AI-assisted prescription fulfilment workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "pillow>=11.0.0",
    "pypdf>=5.1.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.2",
]
vision = [
    "pytesseract>=0.3.13",
    "google-genai>=0.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py312"
